spring:
  application:
    name: "AulaoSecurity"
  config:
    # Carrega o .env local (fora do git) como arquivo de propriedades.
    # Variáveis de ambiente reais do sistema têm prioridade sobre ele.
    import: optional:file:.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
